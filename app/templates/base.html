<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}InvoiceReady{% endblock %}</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0 auto; padding: 2rem 1rem 6rem; max-width: 42rem;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1a1a1a; background: #fff;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
      h2 { font-size: 1.1rem; margin: 2rem 0 0.5rem; }
      .lede { color: #555; margin-top: 0; }
      label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
      select, input[type="number"] { padding: 0.4rem; font: inherit; width: 100%; box-sizing: border-box; }
      fieldset { border: 1px solid #ddd; margin: 1rem 0 0; padding: 0.5rem 1rem 1rem; }
      fieldset label { font-weight: 400; display: inline-block; margin-right: 1rem; }
      button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; font: inherit; cursor: pointer; }
      .obligation { border: 1px solid #ddd; border-left: 4px solid #333; padding: 0.75rem 1rem; margin: 1rem 0; }
      .obligation dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0 0 0.75rem; }
      .obligation dt { font-weight: 600; }
      .obligation dd { margin: 0; }
      .source { font-size: 0.875rem; color: #555; }
      .notice { background: #f4f4f4; border: 1px solid #ddd; padding: 1rem; }
      footer.disclaimer {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: #fffbe6; border-top: 1px solid #e0d48a;
        padding: 0.6rem 1rem; font-size: 0.875rem; text-align: center;
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}

    <!-- Required on every page by 01-BUSINESS-PLAN.md section 5. -->
    <footer class="disclaimer">{{ disclaimer }}</footer>
  </body>
</html>
