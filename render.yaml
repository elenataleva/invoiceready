# Render blueprint for the JSON API (docs/04-FRONTEND-DESIGN.md #8).
#
# Task 17 deliberately kept the Dockerfile host-agnostic and said not to add
# platform config "unless you've chosen a specific host". Render is now that
# host, so this exists to make the deploy reproducible instead of a
# remembered click-path - but the Dockerfile itself stays portable, and
# deleting this file is all it takes to move somewhere else.
#
# The frontend is NOT here: it's a static bundle on Cloudflare Pages, which
# has no Render equivalent and is configured in its own dashboard.
services:
  - type: web
    name: invoiceready-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Same region as the Neon project (aws-eu-central-1), so the database
    # round-trip on every request doesn't cross the Atlantic.
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production

      # sync: false = "prompt me in the dashboard, don't read it from git".
      # Secrets never live in this file (CLAUDE.md: keys come from the
      # environment only).
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # The Cloudflare Pages origin(s), comma-separated. Set this last: the
      # Pages domain doesn't exist until the frontend has been deployed
      # once. Until it's right, the browser blocks every live call with a
      # CORS error while the API itself looks perfectly healthy.
      - key: ALLOWED_ORIGINS
        sync: false

  # The MCP server: the same image and the same rules engine as the API
  # above, reached over JSON-RPC by AI clients instead of over REST by
  # browsers. It is a separate service rather than a path on the API because
  # the two have different lifecycles - this one can be redeployed, or taken
  # down entirely, without touching the thing the frontend depends on.
  - type: web
    name: invoiceready-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Overrides the image's default CMD, which starts the JSON API. No
    # `alembic upgrade head` here on purpose: this server only reads, and two
    # services racing to migrate the same database on deploy is a bad trade
    # for no benefit.
    dockerCommand: python -m mcp_server.server
    plan: free
    region: frankfurt
    envVars:
      - key: MCP_TRANSPORT
        value: http
      # The container is only reachable through Render's proxy, and binding
      # loopback would make the platform's health check fail on a server
      # that is running perfectly well.
      - key: MCP_HOST
        value: "0.0.0.0"
      - key: ENV
        value: production

      - key: DATABASE_URL
        sync: false
      # Never read: this server makes no LLM call. It is required only
      # because app/config.py declares the key mandatory and app/db.py
      # constructs Settings at import. Any non-empty value works.
      - key: ANTHROPIC_API_KEY
        sync: false
