# Evaluation set for /api/ask, per docs/01-BUSINESS-PLAN.md #9 and
# docs/02-TECHNICAL-DESIGN.md #8. Run with `python scripts/run_eval.py` -
# not wired into `pytest`, since it calls the real Anthropic API and costs
# real money per grounded case.
#
# Each case: `question`, `country`, `expected_refused`. Non-refusal cases
# also carry `expected_source_contains` - a substring that must appear in
# at least one returned citation URL. No exact-answer-text matching:
# LLM phrasing varies run to run, but which source grounded the answer
# should not.

# --- Grounded cases: "Who is in scope" (knowledge_base/BE.md) ---
- question: "Do I need to issue structured e-invoices if I'm a VAT-registered business in Belgium?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"
- question: "Does the Belgian e-invoicing mandate apply to small businesses, or only large companies?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"
- question: "I only invoice private consumers, not other businesses - do I need to comply with the Belgian e-invoicing mandate?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"
- question: "Is a Belgian VAT group covered by the structured e-invoicing obligation?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"
- question: "Does using the small-enterprise VAT exemption scheme mean I don't need structured e-invoices in Belgium?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"
- question: "Who exactly is required to send structured electronic invoices in Belgium?"
  country: "BE"
  expected_refused: false
  expected_source_contains: "finance.belgium.be"

