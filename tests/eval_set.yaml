# --- Refusal cases: Poland and France ---
# Same intent as the BE refusal cases: plausible-sounding questions from a
# business owner that our sources genuinely do not answer. The tax-rate and
# payroll-provider cases sit closest to the threshold (measured 0.46 and
# 0.47 similarity against a 0.5 cut-off) and are the ones most likely to
# regress if the knowledge base or threshold changes.
- question: "Can you recommend a good accountant in Warsaw?"
  country: "PL"
