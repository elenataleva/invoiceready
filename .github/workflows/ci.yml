name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python 3.11 to match the Dockerfile's base image - CI should fail on the
  # version that actually ships, not a newer one that happens to be local.
  PYTHON_VERSION: "3.11"
  # Pinned so the embedding-model cache key below is stable.
  HF_HOME: /home/runner/.cache/huggingface

jobs:
  backend:
    name: Backend - ruff + pytest
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real pgvector database rather than sqlite:
      # app/models.py uses pgvector's Vector type, and the retrieval tests
      # assert on real cosine distances, which a stub can't reproduce.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoiceready
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/invoiceready
      # Never used: every test mocks call_claude, and tests/conftest.py's
      # autouse fixture stubs the query rewriter. A real key must never be
      # needed here - if CI starts requiring one, something is making a
      # paid call it shouldn't.
      ANTHROPIC_API_KEY: dummy-key-not-used-in-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-all-MiniLM-L6-v2-${{ hashFiles('app/embeddings.py') }}

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Migrate
        run: alembic upgrade head

      # Both ingest steps, because they fill different tables and the suite
      # asserts against both: ingest.py -> rule_chunks (retrieval, /api/ask),
      # seed_rules.py -> rules (/api/assess, /api/countries/{code}/rules).
      - name: Seed the knowledge base
        run: |
          python scripts/ingest.py
          python scripts/seed_rules.py

      # Not scripts/run_eval.py: it calls the real Anthropic API and costs
      # money per run, so it stays a deliberate local command.
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend - lint + typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this is the typecheck
      # and the production build in one step.
      - name: Typecheck and build
        run: npm run build

      # Runs entirely against committed fixtures - no backend, no network.
      - name: Test
        run: npm test

  api-contract:
    name: API contract - schema.d.ts matches the backend
    runs-on: ubuntu-latest

    env:
      # No Postgres service here on purpose: SQLAlchemy's create_engine is
      # lazy, so /openapi.json renders without ever opening a connection.
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
      ANTHROPIC_API_KEY: dummy-key-not-used-for-schema-generation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-all-MiniLM-L6-v2-${{ hashFiles('app/embeddings.py') }}

      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend

      - name: Start the API
        run: |
          uvicorn app.main:app --port 8000 &
          # app/embeddings.py loads the model at import, so first boot is
          # slow; poll rather than guessing at a sleep.
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - name: Regenerate the client's types
        run: npm run gen:api
        working-directory: frontend

      # docs/04-FRONTEND-DESIGN.md #5.1: "CI regenerates and fails the build
      # on a diff - the frontend cannot silently drift from the backend's
      # Pydantic models." A diff here means someone changed a schema without
      # running `npm run gen:api`.
      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::src/api/schema.d.ts is out of date. Run 'npm run gen:api' with the backend running and commit the result."
            exit 1
          fi
        working-directory: frontend
